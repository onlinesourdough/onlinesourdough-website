<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Runtime metadata is owned by route components and applied by React. These are static fallbacks. -->
    <title>Build better ways to work | onlinesourdough</title>
    <meta
      name="description"
      content="I help solo founders, business leaders, and small teams find a way of working with AI that makes sense for their business."
    />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#f8f2e8" />
    <link rel="canonical" href="https://onlinesourdough.com/" />
    <meta property="og:title" content="Build better ways to work | onlinesourdough" />
    <meta
      property="og:description"
      content="I help solo founders, business leaders, and small teams find a way of working with AI that makes sense for their business."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://onlinesourdough.com/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Build better ways to work | onlinesourdough" />
    <meta
      name="twitter:description"
      content="I help solo founders, business leaders, and small teams find a way of working with AI that makes sense for their business."
    />
    <link rel="icon" type="image/svg+xml" href="/assets/onlinesourdough-mark-large-pixel-v3.svg" />
    <script>
      (() => {
        try {
          const savedTheme = localStorage.getItem("onlinesourdough-theme");
          if (savedTheme === "dark" || savedTheme === "light") {
            document.documentElement.dataset.theme = savedTheme;
          }
        } catch {}

        if ("scrollRestoration" in history) history.scrollRestoration = "manual";

        const navigation = performance.getEntriesByType("navigation")[0];
        const isReload = navigation?.type === "reload" || performance.navigation?.type === 1;
        if (!isReload) return;

        try {
          const cleanUrl = new URL(window.location.href);
          cleanUrl.hash = "";
          history.replaceState(history.state, "", cleanUrl.href);
        } catch {}

        const resetScroll = () => window.scrollTo(0, 0);
        resetScroll();
        window.addEventListener("DOMContentLoaded", resetScroll, { once: true });
        window.addEventListener("load", resetScroll, { once: true });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
