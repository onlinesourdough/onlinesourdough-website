<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Runtime metadata is owned by route components and applied by React. These are static fallbacks. -->
    <title>Valuable AI starts with your data and business context | onlinesourdough</title>
    <meta
      name="description"
      content="I help solo founders and small teams build a data and context foundation AI can use."
    />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#f8f2e8" />
    <link rel="canonical" href="https://onlinesourdough.com/" />
    <meta property="og:title" content="Valuable AI starts with your data and business context | onlinesourdough" />
    <meta
      property="og:description"
      content="I help solo founders and small teams build a data and context foundation AI can use."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://onlinesourdough.com/" />
    <meta name="twitter:title" content="Valuable AI starts with your data and business context | onlinesourdough" />
    <meta
      name="twitter:description"
      content="I help solo founders and small teams build a data and context foundation AI can use."
    />
    <link rel="icon" type="image/svg+xml" href="/assets/onlinesourdough-mark-large-pixel-v3.svg" />
    <script>
      (() => {
        try {
          const savedTheme = localStorage.getItem("onlinesourdough-theme");
          if (savedTheme === "dark" || savedTheme === "light") {
            document.documentElement.dataset.theme = savedTheme;
          }
        } catch {}

        if ("scrollRestoration" in history) history.scrollRestoration = "manual";

        const navigation = performance.getEntriesByType("navigation")[0];
        const isReload = navigation?.type === "reload" || performance.navigation?.type === 1;
        if (!isReload) return;

        try {
          const cleanUrl = new URL(window.location.href);
          cleanUrl.hash = "";
          history.replaceState(history.state, "", cleanUrl.href);
        } catch {}

        const resetScroll = () => window.scrollTo(0, 0);
        resetScroll();
        window.addEventListener("DOMContentLoaded", resetScroll, { once: true });
        window.addEventListener("load", resetScroll, { once: true });
      })();
    </script>
    <link rel="preload" href="/assets/fonts/geist-pixel-square.woff2" as="font" type="font/woff2" crossorigin />
    <meta property="og:image" content="https://onlinesourdough.com/assets/social-preview.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="onlinesourdough — Valuable AI starts with your data and business context." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://onlinesourdough.com/assets/social-preview.png" />
    <meta name="twitter:image:alt" content="onlinesourdough — Valuable AI starts with your data and business context." />
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
