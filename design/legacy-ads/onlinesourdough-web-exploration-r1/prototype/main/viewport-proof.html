<!doctype html><html lang="en"><meta charset="utf-8"><title>Local viewport proof</title><style>html,body{margin:0;padding:0;background:#f6f2e9}iframe{display:block;border:0}</style><nav aria-label="Capture navigation" style="position:fixed;left:1550px;top:20px;display:grid;gap:12px;z-index:10"><button onclick="window.scrollTo({top:0,behavior:'instant'})">Top</button><button onclick="window.scrollBy({top:900,behavior:'instant'})">Next viewport</button></nav><iframe title="Prototype viewport"></iframe><script>const p=new URLSearchParams(location.search),f=document.querySelector('iframe');f.width=Math.max(320,Math.min(2000,Number(p.get('w'))||1400));f.height=900;f.src='/?variant='+encodeURIComponent(p.get('v')||'combined')+'&capture=1';f.addEventListener('load',()=>{f.contentDocument.fonts.ready.then(()=>{const resize=()=>{f.height=f.contentDocument.body.scrollHeight;document.body.dataset.frameWidth=f.contentWindow.innerWidth;document.body.dataset.frameScrollWidth=f.contentDocument.documentElement.scrollWidth;document.body.dataset.frameHeight=f.height;document.title='Viewport proof '+f.width+'px'};resize();new ResizeObserver(resize).observe(f.contentDocument.querySelector('#root')||f.contentDocument.body);})});</script></html>
